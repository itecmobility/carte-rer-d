const P = DATA.postes;
const NDAYS = P[0].sens[0].days.length;
const DAYNAMES = P[0].sens[0].days.map(d => d.name);
const REGIME = P[0].sens[0].days.map(d => d.regime);
let sel = null, timer = null;

// ---------- filtres
const fJour = document.getElementById("fJour"), fHeure = document.getElementById("fHeure"),
      fSens = document.getElementById("fSens");
const JOPT = [["ouvre", "Moyenne jours ouvrés"], ["weekend", "Moyenne week-end"], ["total", "Moyenne période complète"]]
  .concat(DAYNAMES.map((n, i) => ["d" + i, n]));
fJour.innerHTML = JOPT.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
const HOPT = [["all", "Journée entière"], ["hpm", "HPM 7h–9h (moy. horaire)"], ["hps", "HPS 16h–19h (moy. horaire)"]]
  .concat([...Array(24).keys()].map(h => ["h" + h, `${h}h – ${h + 1}h`]));
fHeure.innerHTML = HOPT.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
const SENS = P[0].sens.map(s => s.label);
fSens.innerHTML = `<option value="all">Les deux sens</option>` +
  SENS.map((s, i) => `<option value="${i}">${s}</option>`).join("");
[fJour, fHeure, fSens].forEach(e => e.addEventListener("change", () => { stop(); render(); }));

function daysOf(v) {
  if (v === "ouvre" || v === "weekend") return REGIME.map((r, i) => r === v ? i : -1).filter(i => i >= 0);
  if (v === "total") return [...Array(NDAYS).keys()];
  return [+v.slice(1)];
}
function hoursOf(v) {
  if (v === "all") return [...Array(24).keys()];
  if (v === "hpm") return [7, 8];
  if (v === "hps") return [16, 17, 18];
  return [+v.slice(1)];
}
// valeur moyenne : journée = total/jour ; HPM/HPS = moyenne horaire ; heure = voyageurs dans l'heure
function val(s, kind, jv = fJour.value, hv = fHeure.value) {
  const ds = daysOf(jv), hs = hoursOf(hv);
  let t = 0;
  for (const d of ds) for (const h of hs) t += s.days[d][kind][h];
  t /= ds.length;
  if (hv === "hpm" || hv === "hps") t /= hs.length;
  return t;
}
function hourly(s, kind, jv = fJour.value) {
  const ds = daysOf(jv);
  return [...Array(24).keys()].map(h => ds.reduce((a, d) => a + s.days[d][kind][h], 0) / ds.length);
}
const fr = v => Math.round(v).toLocaleString("fr-FR");
const fr1 = v => v.toLocaleString("fr-FR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const shortSens = s => (s || "").replace(/^vers\s+/i, "");
const sensIdx = () => fSens.value === "all" ? P[0].sens.map((_, i) => i) : [+fSens.value];
const selText = () => {
  const j = fJour.options[fJour.selectedIndex].text, h = fHeure.value;
  const per = h === "all" ? "voyageurs / jour" : (h === "hpm" || h === "hps") ? "voyageurs / heure" : "voyageurs dans l'heure";
  return `${per} — ${j.toLowerCase()} · ${fHeure.options[fHeure.selectedIndex].text}`;
};
const upDown = (m, d) => `<span class="tri up">▲</span> ${fr(m)} &nbsp;<span class="tri down">▼</span> ${fr(d)}`;

// ---------- carte
const map = L.map("map", {zoomSnap: 0.25});
/* fond de carte (fonds_carte.py) */
(() => {
  const fonds = [{"nom": "Plan IGN", "url": "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&FORMAT=image/png", "attribution": "© IGN – Géoplateforme", "actif": true}, {"nom": "Photo aérienne IGN", "url": "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&FORMAT=image/jpeg", "attribution": "© IGN – Géoplateforme", "actif": false}];
  const couches = {};
  for (const f of fonds) {
    couches[f.nom] = L.tileLayer(f.url, { maxZoom: 19, attribution: f.attribution });
    if (f.actif) couches[f.nom].addTo(map);
  }
  L.control.layers(couches, null, { position: "topright" }).addTo(map);
})();
/* fin du fond de carte */
const bounds = L.latLngBounds(P.map(p => [p.lat, p.lon]));
map.fitBounds(bounds, {padding: [40, 40]});
L.polyline(P.map(p => [p.lat, p.lon]), {color: "#1d3557", weight: 4, opacity: .55}).addTo(map);
const layer = L.layerGroup().addTo(map);
map.on("click", () => { if (sel !== null) { sel = null; render(); } });

function select(id) {
  sel = (sel === id) ? null : id;
  render();
  if (sel !== null) {
    const p = P.find(x => x.id === sel);
    if (!map.getBounds().pad(-0.15).contains([p.lat, p.lon])) map.panTo([p.lat, p.lon]);
  }
}

function render() {
  layer.clearLayers();
  P.forEach((p, i) => {
    const rows = sensIdx().map(k => {
      const s = p.sens[k];
      return `<div><span class="sn">${shortSens(s.label)}</span> ${upDown(val(s, "mts"), val(s, "dsc"))}</div>`;
    }).join("");
    const icon = L.divIcon({
      className: "poste-badge" + (p.id === sel ? " sel" : ""), iconSize: [0, 0],
      html: `<div class="pin"><svg class="lead"><line x1="0" y1="0" x2="0" y2="0"/></svg><div class="dot">${p.id}</div>
             <div class="lab" data-i="${i}"><b>${p.name}</b>${rows}</div></div>`
    });
    L.marker([p.lat, p.lon], {icon, zIndexOffset: p.id === sel ? 1000 : 0})
      .on("click", e => { L.DomEvent.stopPropagation(e); select(p.id); })
      .addTo(layer);
  });
  document.getElementById("legSel").textContent = selText();
  placeLabels();
  renderInfo();
}

// placement des étiquettes sans chevauchement : côté droit/gauche de la gare
// (en alternance par défaut) et, si besoin, léger décalage vertical
function placeLabels() {
  const labs = [...document.querySelectorAll(".lab")];
  const pts = P.map(p => map.latLngToContainerPoint([p.lat, p.lon]));
  const taken = pts.map(pt => ({x0: pt.x - 14, x1: pt.x + 14, y0: pt.y - 14, y1: pt.y + 14}));
  const G = 3;   // marge entre étiquettes (px)
  const hit = r => taken.some(t => r.x0 - G < t.x1 && t.x0 < r.x1 + G && r.y0 - G < t.y1 && t.y0 < r.y1 + G);
  const DY = [0];
  for (let k = 12; k <= 144; k += 12) DY.push(-k, k);
  for (const el of labs) {
    const i = +el.dataset.i, pt = pts[i], w = el.offsetWidth, h = el.offsetHeight;
    const sides = i % 2 === 0 ? ["r", "l"] : ["l", "r"];
    let best = null;
    search: for (const dx of [18, 60]) for (const dy of DY) for (const sd of sides) {
      const x0 = sd === "r" ? pt.x + dx : pt.x - dx - w, y0 = pt.y - 16 + dy;
      const r = {x0, x1: x0 + w, y0, y1: y0 + h};
      if (!hit(r)) { best = {sd, dx, dy, r}; break search; }
    }
    if (!best) best = {sd: sides[0], dx: 18, dy: 0, r: null};
    el.classList.remove("r", "l"); el.classList.add(best.sd);
    el.style.top = (-16 + best.dy) + "px";
    el.style.left = best.sd === "r" ? best.dx + "px" : "";
    el.style.right = best.sd === "l" ? best.dx + "px" : "";
    if (best.r) taken.push(best.r);
    // trait de rappel gare -> étiquette quand celle-ci est décalée
    const ln = el.parentNode.querySelector(".lead line");
    const far = best.dx > 18 || Math.abs(best.dy) > 12;
    const ex = best.sd === "r" ? best.dx : -best.dx;
    const ey = Math.min(Math.max(0, -16 + best.dy + 8), -16 + best.dy + h - 8);
    ln.setAttribute("x2", far ? ex : 0); ln.setAttribute("y2", far ? ey : 0);
  }
}
map.on("zoomend", placeLabels);

// ---------- panneau
function chartSvg(s) {
  const m = hourly(s, "mts"), d = hourly(s, "dsc");
  const W = 340, H = 120, pad = 18, bw = (W - pad) / 24;
  const mx = Math.max(1, ...m, ...d);
  const hs = hoursOf(fHeure.value), hl = fHeure.value !== "all";
  let g = "";
  for (let h = 0; h < 24; h++) {
    const x = pad + h * bw;
    if (hl && hs.includes(h)) g += `<rect x="${x}" y="0" width="${bw}" height="${H - 14}" fill="#fef3c7"/>`;
    const hm = (m[h] / mx) * (H - 20), hd = (d[h] / mx) * (H - 20);
    g += `<rect x="${x + 1}" y="${H - 14 - hm}" width="${bw / 2 - 1}" height="${hm}" fill="#d62828"><title>${h}h : ${fr(m[h])} montées</title></rect>`;
    g += `<rect x="${x + bw / 2}" y="${H - 14 - hd}" width="${bw / 2 - 1}" height="${hd}" fill="#1f9d3a"><title>${h}h : ${fr(d[h])} descentes</title></rect>`;
    if (h % 3 === 0) g += `<text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle">${h}h</text>`;
  }
  g += `<line x1="${pad}" x2="${W}" y1="${H - 14}" y2="${H - 14}" stroke="#9ca3af"/>`;
  g += `<text x="${pad - 3}" y="9" text-anchor="end">${fr(mx)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

function regimeRows(s, label, cls, jv) {
  const days = daysOf(jv).length;
  const m = val(s, "mts", jv, "all"), d = val(s, "dsc", jv, "all");
  const pm = val(s, "mts", jv, "hpm"), pd = val(s, "dsc", jv, "hpm");
  const sm = val(s, "mts", jv, "hps"), sd = val(s, "dsc", jv, "hps");
  return `<tr class="reg ${cls}"><td>${label} (${days} j)</td><th class="up">▲ Mts</th><th class="down">▼ Dsc</th><th>Tot</th></tr>
    <tr><td>Moyenne / jour</td><td class="num">${fr(m)}</td><td class="num">${fr(d)}</td><td class="num">${fr(m + d)}</td></tr>
    <tr><td>Moyenne / heure</td><td class="num">${fr1(m / 24)}</td><td class="num">${fr1(d / 24)}</td><td class="num">${fr1((m + d) / 24)}</td></tr>
    <tr><td>HPM 7h–9h / heure</td><td class="num">${fr1(pm)}</td><td class="num">${fr1(pd)}</td><td class="num">${fr1(pm + pd)}</td></tr>
    <tr><td>HPS 16h–19h / heure</td><td class="num">${fr1(sm)}</td><td class="num">${fr1(sd)}</td><td class="num">${fr1(sm + sd)}</td></tr>`;
}

function renderInfo() {
  const el = document.getElementById("info");
  const ks = sensIdx();
  if (sel === null) {
    let html = `<h2>Vue d'ensemble</h2>
      <p class="hint">${selText()}.<br><b>Cliquez sur une gare</b> (carte ou tableau) pour le détail par sens et le profil horaire.</p>
      <table><thead><tr><th>Gare</th><th>Sens</th><th class="up">▲ Mts</th><th class="down">▼ Dsc</th></tr></thead><tbody>`;
    let TM = 0, TD = 0;
    for (const p of P) ks.forEach((k, j) => {
      const s = p.sens[k], m = val(s, "mts"), d = val(s, "dsc");
      TM += m; TD += d;
      html += `<tr class="click" data-id="${p.id}"><td>${j === 0 ? `${p.id}. ${p.name}` : ""}</td>
        <td>${shortSens(s.label)}</td><td class="num">${fr(m)}</td><td class="num">${fr(d)}</td></tr>`;
    });
    html += `<tr class="sum"><td>Ensemble des gares</td><td></td><td class="num">${fr(TM)}</td><td class="num">${fr(TD)}</td></tr></tbody></table>`;
    el.innerHTML = html;
    el.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => select(tr.dataset.id));
    return;
  }
  const p = P.find(x => x.id === sel);
  let html = `<button class="back" id="back">← Toutes les gares</button>
    <h2>Poste ${p.id} — ${p.name}</h2><p class="meta">${p.periode || ""}</p>`;
  for (const k of ks) {
    const s = p.sens[k];
    html += `<h3>Sens : ${s.label}</h3>
      <p class="meta">Actuellement : ${upDown(val(s, "mts"), val(s, "dsc"))} — ${selText()}</p>
      <div class="meta">Profil horaire (${fJour.options[fJour.selectedIndex].text.toLowerCase()})</div>
      ${chartSvg(s)}
      <table>${regimeRows(s, "Jours ouvrés", "", "ouvre")}${regimeRows(s, "Week-end", "we", "weekend")}
             ${regimeRows(s, "Période complète", "tot", "total")}</table>`;
  }
  el.innerHTML = html;
  document.getElementById("back").onclick = () => select(sel);
}

// ---------- défilement des heures
const playBtn = document.getElementById("play");
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "▶"; } }
playBtn.onclick = () => {
  if (timer) return stop();
  playBtn.textContent = "❚❚";
  let h = /^h\d+$/.test(fHeure.value) ? +fHeure.value.slice(1) : 4;   // départ : heure choisie, sinon 5h
  const step = () => { h = (h + 1) % 24; fHeure.value = "h" + h; render(); };
  step(); timer = setInterval(step, 1200);
};

render();
// recadrage une fois la page mise en page (évite un zoom maximal si la carte
// n'avait pas encore sa taille au chargement du script)
window.addEventListener("load", () => {
  map.invalidateSize(); map.fitBounds(bounds, {padding: [40, 40]}); placeLabels();
});
</script>
